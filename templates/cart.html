
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Cart</title>
    <link rel="stylesheet"
          href="{{ url_for('static', path='/style.css') }}">
</head>
<body>
    <h1>My Shopping Cart</h1>

    {% for item in items %}
        <div class="product">
            <h3>{{ item.product.name }}</h3>
            <p>Quantity: {{ item.quantity }}</p>
            <p>Price per item: {{ item.product.price }}</p>
            <p>Subtotal: {{ item.subtotal }}</p>
        </div>
    {% else %}
        <p>Your cart is empty.</p>
    {% endfor %}

    <h2>Total: {{ total }}</h2>

    <a href="/products-page">Continue Shopping</a>
</body>
</html>
