<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        .profile {
            text-align: center;
            margin-bottom: 35px;
        }

        .avatar {
            width: 85px;
            height: 85px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 18px;
            font-size: 35px;
            color: white;
            font-weight: bold;
        }

        .profile h1 {
            color: white;
            font-size: 25px;
            margin-bottom: 8px;
        }

        .profile p {
            color: #94a3b8;
            font-size: 14px;
        }

        .info {
            background: #0f172a;
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid #334155;
        }

        .info label {
            display: block;
            color: #94a3b8;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 9px;
        }

        .info p {
            color: #f8fafc;
            font-size: 16px;
            overflow-wrap: anywhere;
        }

        .status {
            display: inline-block;
            background: #064e3b;
            color: #6ee7b7;
            padding: 7px 13px;
            border-radius: 20px;
            font-size: 12px;
            margin-top: 20px;
        }

        .footer {
            text-align: center;
            color: #64748b;
            font-size: 12px;
            margin-top: 25px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="profile">
            <div class="avatar">U</div>

            <h1>User Profile</h1>
            <p>Account Information</p>

            <span class="status">● Account Details</span>
        </div>

        <div class="info">
            <label>User ID</label>
            <p>#{{ user.id }}</p>
        </div>

        <div class="info">
            <label>Email Address</label>
            <p>{{ user.email }}</p>
        </div>

        <div class="info">
            <label>Account Created</label>
            <p>{{ user.created_at }}</p>
        </div>

        <div class="footer">
            User Management System
        </div>

    </div>

</body>
</html>
